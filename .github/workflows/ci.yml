name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# La extensión no publica nada: se carga sin empaquetar desde `dist/`, y la
# subida a la Chrome Web Store es una decisión con su propia issue. Así que aquí
# no hay job de publicación, sólo la comprobación de que lo que hay se construye
# y sus reglas siguen diciendo lo que dicen.

jobs:
  test:
    name: Reglas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ejecuta TypeScript directamente, sin compilar. Las suites de
      # `test/` no dependen del motor criptográfico —de ahí que `matching.ts` y
      # `fields.ts` reciban el catálogo en vez de importarlo—, así que este job
      # corre sin tocar GitHub Packages y falla rápido si la regla de dominios
      # se rompe.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run suites
        run: node --test "test/*.test.ts"

  build:
    name: Construcción
    runs-on: ubuntu-latest
    # El motor criptográfico vive en GitHub Packages. A fecha de 2026-09-18 el
    # paquete sigue PRIVADO, y su repositorio vinculado sigue siendo
    # `AcheronCoreWeb` —el que se archivó al unificar en `AcheronCore`— porque
    # GitHub conserva el vínculo de la PRIMERA publicación aunque las versiones
    # siguientes salgan de otro sitio: 2.2.0 se publicó desde `AcheronCore`, con
    # sus cinco jobs en verde. Como el acceso se hereda del repositorio
    # vinculado, el GITHUB_TOKEN de éste recibe un 403 `permission_denied`.
    #
    # Se arregla por la interfaz de GitHub, de una de estas dos formas:
    #   - Packages → acheron-core-web → Package settings → Change visibility →
    #     Public. Coherente con que `AcheronCore` ya es público, y entonces
    #     cualquier token lo lee.
    #   - O bien Manage Actions access → añadir `AcheronExtension`, si se
    #     prefiere que el paquete siga privado.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: '@projectellysia'

      # package-lock.json está en .gitignore, como en AcheronCore: no hay
      # lockfile que cachear ni con el que hacer `npm ci`.
      # Las dos variables, y no es redundancia: el `.npmrc` del repositorio
      # tiene precedencia sobre el que escribe `setup-node`, y resuelve
      # `${NPM_TOKEN}`. Con sólo `NODE_AUTH_TOKEN` se manda un token vacío y el
      # registro contesta un 401 que parece un problema de permisos y no lo es.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      # Que `dist/` salga es la comprobación que de verdad importa aquí: es
      # donde se ve si el empaquetado sigue resolviendo `hash-wasm` dentro de un
      # service worker de tipo módulo, que es lo único que MV3 pone difícil.
      - name: Build
        run: npm run build
