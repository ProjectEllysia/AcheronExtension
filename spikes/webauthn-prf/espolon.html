<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Espolón WebAuthn PRF</title>
    <style>
      body { width: 30rem; padding: 1rem; font: 14px/1.5 system-ui, sans-serif; background: #14121a; color: #e9e6f0; }
      h1 { font-size: 1rem; margin: 0 0 0.75rem; }
      button { display: block; width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; border: 0; border-radius: 0.375rem; background: #7c5cff; color: #fff; font: inherit; cursor: pointer; }
      pre { white-space: pre-wrap; word-break: break-all; background: #1c1926; border: 1px solid #2b2735; border-radius: 0.375rem; padding: 0.5rem; min-height: 8rem; margin: 0; }
      .ok { color: #7ee787; } .mal { color: #ff6b7a; } .nota { color: #9d97ad; }
    </style>
  </head>
  <body>
    <h1>Espolón: WebAuthn PRF en una página de extensión</h1>
    <button id="registrar">1 · Registrar credencial (¿admite PRF?)</button>
    <button id="derivar">2 · Derivar el secreto</button>
    <button id="repetir">3 · Derivar otra vez — ¿sale el mismo?</button>
    <button id="contraprueba">4 · Contraprueba: otro salt — debe salir distinto</button>
    <button id="limpiar">Borrar lo guardado y empezar de cero</button>
    <pre id="salida"></pre>
    <script src="espolon.js"></script>
  </body>
</html>
